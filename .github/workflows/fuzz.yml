name: Fuzz

# The quality gate runs the fuzz targets against their committed seeds only, so
# it stays deterministic. The mutation engine is non-deterministic and unbounded
# by nature, which makes it a poor merge blocker but a good background search.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: How long to fuzz each target
        default: 2m
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    name: fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: true
          cache-dependency-path: |
            go.mod
            Makefile
          go-version-file: go.mod

      - name: Fuzz every target
        run: make fuzz FUZZTIME="${{ inputs.fuzztime || '2m' }}"

      # A failing target writes the input that reproduces it into testdata, so
      # the artifact is the only way to turn this run into a committed seed.
      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-failures
          path: "**/testdata/fuzz/**"
          if-no-files-found: warn
