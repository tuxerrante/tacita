[global]
cache-dir = ".go/rumdl-cache"
# MD013 (line-length) is disabled repo-wide: hard line-length wrapping is not
# useful for this repo's prose, and it would flag CLAUDE.md's mandated 102-char
# guidance prefix line.
disable = ["MD013"]
# .bingo holds bingo-generated manifests and README; they are regenerated by the
# tool, so linting them only produces churn we cannot fix at the source.
exclude = [".bingo"]
